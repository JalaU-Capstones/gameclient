name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public env vars required by SvelteKit's $env/static/public.
  # Values are placeholders: they are used only for type-checking
  # during `svelte-kit sync`. Real values are injected at Docker build
  # time via build args (see docker-compose.yml).
  PUBLIC_API_BASE: http://localhost:8080
  PUBLIC_WS_BASE: http://localhost:8080
  PUBLIC_REQUEST_TIMEOUT_MS: '15000'

jobs:
  quality:
    name: Quality (lint + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:cov

      - name: Build
        run: pnpm build

  docker:
    name: Docker build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gameclient:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --detach --name gameclient-ci --publish 3000:3000 gameclient:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://localhost:3000/; then
              docker rm --force gameclient-ci
              exit 0
            fi
            sleep 2
          done
          docker logs gameclient-ci
          docker rm --force gameclient-ci
          exit 1
