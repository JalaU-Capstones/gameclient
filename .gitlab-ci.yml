default:
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

variables:
  PNPM_STORE_DIR: '$CI_PROJECT_DIR/.pnpm-store'

stages:
  - quality
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

lint:prettier:
  stage: quality
  script:
    - pnpm exec prettier --check .

lint:eslint:
  stage: quality
  script:
    - pnpm exec eslint .

check:svelte:
  stage: quality
  script:
    - pnpm run check

test:node:
  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ['22', '24']
  image: node:${NODE_VERSION}-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  script:
    - pnpm test:cov

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - build/
    expire_in: 1 week

docker:build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
  before_script: []
  cache: {}
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
