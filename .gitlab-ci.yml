default:
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

variables:
  PNPM_STORE_DIR: '$CI_PROJECT_DIR/.pnpm-store'
  PUBLIC_API_BASE: 'http://localhost:8080'
  PUBLIC_WS_BASE: 'http://localhost:8080'
  PUBLIC_REQUEST_TIMEOUT_MS: '15000'

stages:
  - quality
  - test
  - coverage
  - build
  - verify

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

lint:prettier:
  stage: quality
  script:
    - pnpm exec prettier --check .

lint:eslint:
  stage: quality
  script:
    - pnpm exec eslint .

check:svelte:
  stage: quality
  script:
    - pnpm run check

test:node:
  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ['22', '24']
  image: node:${NODE_VERSION}-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  script:
    - pnpm test:cov
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

coverage:codecov:
  stage: coverage
  image: python:3.12-alpine
  before_script: []
  cache: {}
  script:
    - |
      if [ -n "$CODECOV_TOKEN" ]; then
        apk add --no-cache curl
        curl -fsSL https://uploader.codecov.io/latest/linux/codecov -o codecov
        chmod +x codecov
        ./codecov -t "$CODECOV_TOKEN" -f coverage/lcov.info || true
      else
        echo "CODECOV_TOKEN is not configured; skipping Codecov upload."
      fi
  needs:
    - test:node
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: never

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - build/
    expire_in: 1 week

verify:production:
  stage: verify
  image: curlimages/curl:8.8.0
  before_script: []
  cache: {}
  script:
    - |
      if [ -z "$PRODUCTION_URL" ]; then
        echo "PRODUCTION_URL is not set. Skipping verification."
        exit 0
      fi
      curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL}/health"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

docker:build:
  stage: build
  timeout: 20m
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
  before_script: []
  cache: {}
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
